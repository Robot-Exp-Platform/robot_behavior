[package]
name = "roplat_behavior"
version = "0.9.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
readme = "../README.md"
description = "Typed robot capability contracts for roplat drivers"
keywords = ["robot", "robotics", "behavior", "roplat"]

[dependencies]
roplat = { version = "0.6.0-rc.1", optional = true }
roplat_msgs = { version = "0.6.0-rc.1", features = ["nalgebra", "serde"] }
nalgebra = { version = "0.34.1", features = ["serde-serialize"] }
serde = { version = "1.0.228", features = ["derive", "alloc"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
anyhow = "1.0.100"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[features]
default = []
# Contract conformance checks for driver tests.
conformance = []
roplat = ["dep:roplat"]

[[bench]]
name = "control_flow"
harness = false
required-features = ["roplat"]

[[bench]]
name = "native_async_control"
harness = false
required-features = ["roplat"]
