[package]
name = "roplat_behavior"
version = "0.9.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
readme = "../README.md"
description = "Typed robot capability contracts for roplat drivers"
keywords = ["robot", "robotics", "behavior", "roplat"]

[lib]
name = "roplat_behavior"
crate-type = ["cdylib", "rlib"]

[dependencies]
roplat = { version = "0.6.0-rc.1", optional = true }
roplat_msgs = { version = "0.6.0-rc.1", features = ["nalgebra", "serde"] }
pyo3 = { version = "0.28.3", optional = true, features = [
    "extension-module",
    "multiple-pymethods",
] }
cxx = { version = "1.0.188", optional = true }
nalgebra = { version = "0.34.1", features = ["serde-serialize"] }
serde = { version = "1.0.228", features = ["derive", "alloc"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
anyhow = "1.0.100"
paste = "1.0.15"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[features]
default = []
# Contract conformance checks for driver tests.
conformance = []
roplat = ["dep:roplat"]
ffi = []
to_c = ["ffi"]
to_cxx = ["ffi", "cxx"]
to_py = ["ffi", "pyo3"]

[[bench]]
name = "control_flow"
harness = false
required-features = ["roplat"]

[[bench]]
name = "native_async_control"
harness = false
required-features = ["roplat"]
