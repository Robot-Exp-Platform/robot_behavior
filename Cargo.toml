[workspace]
members = ["roplat_behavior", "roplat_kinematics", "roplat_control", "roplat_trajectory", "roplat_description", "roplat_safety"]
resolver = "3"

# The six crates share one README and one version.
[workspace.package]
version = "0.9.0"
edition = "2024"
authors = ["Yixing <yanjizhou312@163.com>"]
license = "Apache-2.0"
repository = "https://github.com/Robot-Exp-Platform/roplat_behavior"
categories = ["science::robotics"]

# roplat_msgs is not on crates.io yet; develop against the sibling core
# checkout. Published crates ignore this section.
[patch.crates-io]
roplat = { path = "../roplat/roplat" }
roplat_msgs = { path = "../roplat/roplat_msgs" }
