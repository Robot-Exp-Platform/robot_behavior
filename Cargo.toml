[package]
name = "robot_behavior"
version = "0.6.0"
edition = "2024"
authors = ["Yixing <yanjizhou312@163.com>"]
readme = "README.md"
repository = "https://github.com/Robot-Exp-Platform/robot_behavior"
license = "Apache-2.0"
description = "a library for robot common behavior"
categories = ["science::robotics"]
keywords = ["robot", "robotics", "behavior", "roplat"]

[lib]
name = "robot_behavior"
crate-type = ["cdylib", "rlib"]

[dependencies]
roplat = { version = "0.2.2", git = "ssh://git@github.com/Robot-Exp-Platform/roplat.git", rev = "b47f7b6aa54a230417331e4b85cefcc8eff9e128", optional = true }
copp = { version = "0.2.2" }
pyo3 = { version = "0.28.3", optional = true, features = [
    "extension-module",
    "multiple-pymethods",
] }
cxx = { version = "1.0.188", optional = true }
nalgebra = { version = "0.34.1", features = ["serde-serialize"] }
serde = { version = "1.0.228", features = ["derive", "alloc"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
anyhow = "1.0.100"
paste = "1.0.15"
futures = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.177"
plotters = "0.3.7"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3.9", features = ["processthreadsapi", "winbase"] }
plotters = "0.3.7"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[features]
default = []
roplat = ["dep:roplat"]
ffi = []
to_c = ["ffi"]
to_cxx = ["ffi", "cxx"]
to_py = ["ffi", "pyo3"]

[[bench]]
name = "control_flow"
harness = false
required-features = ["roplat"]

[[bench]]
name = "native_async_control"
harness = false
required-features = ["roplat"]
