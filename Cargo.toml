[workspace]
members = ["roplat_behavior", "roplat_kinematics", "roplat_control", "roplat_trajectory", "roplat_description", "roplat_frames", "roplat_safety", "roplat_scene", "roplat_world"]
resolver = "3"

# The crates share one README. Each declares its own version, so an
# algorithm crate can change without moving the contract crate and the
# drivers with it.
[workspace.package]
edition = "2024"
authors = ["Yixing <yanjizhou312@163.com>"]
license = "Apache-2.0"
repository = "https://github.com/Robot-Exp-Platform/roplat_behavior"
categories = ["science::robotics"]

# roplat_msgs is not on crates.io yet; develop against the sibling core
# checkout. Published crates ignore this section.
[patch.crates-io]
roplat = { path = "../roplat/roplat" }
roplat_msgs = { path = "../roplat/roplat_msgs" }
