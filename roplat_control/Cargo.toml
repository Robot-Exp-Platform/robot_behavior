[package]
name = "roplat_control"
version = "0.9.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
readme = "../README.md"
description = "PID, impedance and model-based controllers for roplat_behavior robots"
keywords = ["robot", "robotics", "control", "roplat"]

[dependencies]
roplat_behavior = { version = "0.9.0", path = "../roplat_behavior" }
nalgebra = "0.34.1"
roplat = { version = "0.6.0-rc.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
roplat_description = { version = "0.9.0", path = "../roplat_description" }
roplat_kinematics = { version = "0.9.0", path = "../roplat_kinematics" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.177"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3.9", features = ["processthreadsapi", "winbase"] }

[features]
default = []
# The Cartesian trajectory follower as a roplat node.
roplat = ["dep:roplat", "roplat_behavior/roplat"]
