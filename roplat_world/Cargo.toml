[package]
name = "roplat_world"
version = "0.9.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
readme = "../README.md"
description = "Simulator, physics-engine and renderer contracts for roplat_behavior robots"
keywords = ["robot", "robotics", "simulation", "roplat"]

[dependencies]
roplat_behavior = { version = "0.9.0", path = "../roplat_behavior" }
roplat_description = { version = "0.9.0", path = "../roplat_description" }
anyhow = "1.0.100"
nalgebra = "0.34.1"
roplat = { version = "0.6.0-rc.1", optional = true }
futures = { version = "0.3", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[features]
default = []
# SimulationRhythm, stepping a physics engine as a roplat rhythm.
roplat = ["dep:roplat", "dep:futures", "dep:tokio", "roplat_behavior/roplat"]
