[package]
name = "roplat_diagnostics"
version = "0.9.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
readme = "../README.md"
description = "Runtime observation for roplat graphs: rate, period and latency probes, health checks, status aggregation"
keywords = ["robot", "robotics", "diagnostics", "monitoring", "roplat"]

[dependencies]
roplat_msgs = "0.6.0-rc.1"
roplat = { version = "0.6.0-rc.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[features]
default = []
# ProbeNode, a pass-through node that feeds a check; the probes and checks
# themselves need no runtime.
roplat = ["dep:roplat"]
