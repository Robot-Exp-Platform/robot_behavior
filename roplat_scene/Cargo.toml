[package]
name = "roplat_scene"
version = "0.9.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
readme = "../README.md"
description = "Collision checking for motion planning: robot self-collision, world and attached objects, allowed contacts"
keywords = ["robot", "robotics", "collision", "planning", "roplat"]

[dependencies]
roplat_description = { version = "0.9.0", path = "../roplat_description" }
nalgebra = "0.34.1"
# 0.25 is the last parry on nalgebra; 0.26 moved to glam.
parry3d-f64 = { version = "0.25.3", default-features = false, features = ["required-features", "std", "alloc"] }
thiserror = "2.0.17"

[dev-dependencies]
roplat_trajectory = { version = "0.9.0", path = "../roplat_trajectory" }
