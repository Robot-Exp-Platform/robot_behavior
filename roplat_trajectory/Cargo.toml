[package]
name = "roplat_trajectory"
version = "0.9.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
readme = "README.md"
description = "Trajectory interpolation, COPP time scaling and trajectory following on roplat_msgs data"
keywords = ["robot", "robotics", "trajectory", "roplat"]

[dependencies]
roplat_msgs = { version = "0.6.0-rc.1", features = ["nalgebra"] }
roplat = { version = "0.6.0-rc.1", optional = true }
copp = "=0.2.2"
nalgebra = "0.34.1"
thiserror = "2.0.17"

[dev-dependencies]
# Tests drive the follower through a roplat_behavior control session.
roplat_behavior = { version = "0.9.0", path = "../roplat_behavior", features = ["roplat"] }
roplat_description = { version = "0.9.0", path = "../roplat_description" }
roplat_kinematics = { version = "0.9.0", path = "../roplat_kinematics" }
tokio = { version = "1", features = ["rt", "macros"] }

[features]
default = []
# The follower as a roplat node, and its error carried through a drive.
roplat = ["dep:roplat"]

# The interpolation tests plot their curves; plotters' font stack does not
# build on macOS with current nightly, so they run on Linux and Windows.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dev-dependencies]
plotters = "0.3.7"
